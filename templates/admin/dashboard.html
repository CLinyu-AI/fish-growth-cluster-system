{% extends "admin/base.html" %}

{% block title %}首页{% endblock %}

{% block content %}
<div class="card">
    <h1 style="text-align: center; margin-bottom: 20px;">欢迎使用鱼类生长特征聚类分析系统</h1>
    <p style="text-align: center; font-size: 18px; color: #666; margin-bottom: 40px;">基于无监督聚类算法，实现鱼类生长数据的自动化分析与类群划分</p>
    
    <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('admin.data_manage') }}" class="btn btn-primary" style="padding: 15px 30px; font-size: 16px;">开始导入数据</a>
        <a href="{{ url_for('admin.train_manage') }}" class="btn btn-success" style="padding: 15px 30px; font-size: 16px;">进入模型训练</a>
        <a href="{{ url_for('admin.result_manage') }}" class="btn btn-primary" style="padding: 15px 30px; font-size: 16px;">查看聚类结果</a>
    </div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 30px;">
    <div class="card" style="text-align: center;">
        <h3 style="font-size: 36px; color: #3498db;">{{ user_count }}</h3>
        <p>系统用户总数</p>
    </div>
    <div class="card" style="text-align: center;">
        <h3 style="font-size: 36px; color: #27ae60;">{{ dataset_count }}</h3>
        <p>数据集总数</p>
    </div>
    <div class="card" style="text-align: center;">
        <h3 style="font-size: 36px; color: #f39c12;">{{ model_count }}</h3>
        <p>训练模型总数</p>
    </div>
    <div class="card" style="text-align: center;">
        <h3 style="font-size: 36px; color: #e74c3c;">{{ task_count }}</h3>
        <p>训练任务总数</p>
    </div>
</div>
{% endblock %}
