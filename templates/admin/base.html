<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理员面板{% endblock %} - 鱼类生长特征分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            min-height: 100vh;
            background-color: #f5f7fa;
        }
        /* 左侧固定侧边栏 */
        .sidebar {
            width: 240px;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }
        /* 侧边栏顶部：系统名称 */
        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid #34495e;
        }
        .sidebar-header h1 {
            color: white;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
        }
        /* 侧边栏中间：功能导航 - 适配li结构 */
        .sidebar-menu {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
            list-style: none; /* 去掉li默认样式 */
        }
        .sidebar-menu .nav-item {
            width: 100%;
        }
        .sidebar-menu .nav-link {
            display: block;
            color: #bdc3c7;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 15px;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .sidebar-menu .nav-link:hover, .sidebar-menu .nav-link.active {
            background-color: #34495e;
            color: white;
            border-left-color: #3498db;
        }
        /* 侧边栏底部：用户信息+退出登录 */
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid #34495e;
        }
        .user-info {
            color: white;
            margin-bottom: 10px;
        }
        .user-info .username {
            font-size: 14px;
            font-weight: 500;
        }
        .logout-btn {
            display: block;
            width: 100%;
            padding: 8px 0;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
        /* 右侧主内容区 */
        .main-content {
            margin-left: 240px;
            flex: 1;
            padding: 30px;
            width: calc(100% - 240px);
        }
    </style>
</head>
<body>
    <!-- 左侧侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>鱼类生长特征<br>聚类分析系统</h1>
        </div>

        <ul class="sidebar-menu"> <!-- 改为ul -->
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('admin.dashboard') }}">首页</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'data' %}active{% endif %}" href="{{ url_for('admin.data_manage') }}">数据管理</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'train' %}active{% endif %}" href="{{ url_for('admin.train_manage') }}">模型训练</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'result' %}active{% endif %}" href="{{ url_for('admin.result_manage') }}">聚类结果</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'history' %}active{% endif %}" href="{{ url_for('admin.train_history') }}">训练历史</a>
            </li>
            <!-- 插入备注管理 -->
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'remark' %}active{% endif %}" href="{{ url_for('admin.remark_manage') }}">
                    信息管理
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'logs' %}active{% endif %}" href="{{ url_for('admin.operation_logs') }}">操作日志</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'user' %}active{% endif %}" href="{{ url_for('admin.user_manage') }}">用户管理</a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="user-info">
                <span class="username">管理员：{{ session.username }}</span>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn">退出登录</a>
        </div>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block js %}{% endblock %}
</body>
</html>
