<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户注册</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* 卡片 */

.card{
width:450px;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
box-shadow:0 10px 40px rgba(0,0,0,0.3);
color:white;
}

.title{
text-align:center;
font-size:24px;
margin-bottom:30px;
}

.group{
margin-bottom:18px;
}

.group label{
font-size:14px;
display:block;
margin-bottom:6px;
}

.input-box{
display:flex;
align-items:center;
background:rgba(255,255,255,0.15);
padding:10px;
border-radius:10px;
}

.input-box i{
margin-right:10px;
}

.input-box input,
.input-box select{
background:none;
border:none;
outline:none;
color:white;
width:100%;
font-size:14px;
}

input::placeholder{
color:#ddd;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#00c6ff,#0072ff);
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
transform:translateY(-2px);
}

.link{
text-align:center;
margin-top:15px;
}

.link a{
color:white;
text-decoration:underline;
}

/* 密码强度 */

.strength{
height:6px;
border-radius:5px;
background:#ddd;
margin-top:6px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:red;
transition:0.3s;
}

</style>

</head>

<body>

<div class="card">

<div class="title">🐟 用户注册</div>

{% if success %}
<div style="padding: 12px; border-radius: 8px; background: rgba(72, 187, 120, 0.2); border: 1px solid #48bb78; color: #9ae6b4; margin-bottom: 20px; text-align: center;">
  <i class="fa fa-check-circle"></i> {{ success }}
</div>
{% endif %}

{% if error %}
<div style="padding: 12px; border-radius: 8px; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; margin-bottom: 20px; text-align: center;">
  <i class="fa fa-exclamation-circle"></i> {{ error }}
</div>
{% endif %}

<form id="registerForm" method="post">

<div class="group">
<label>注册角色</label>
<div class="input-box">
<i class="fa fa-user"></i>
<select name="role_type" id="roleSelect">
<option value="user">普通用户</option>
<option value="admin">管理员</option>
</select>
</div>
</div>

<div class="group">
<label>账号</label>
<div class="input-box">
<i class="fa fa-id-card"></i>
<input type="text" name="username" id="username"
placeholder="纯数字" required>
</div>
</div>

<div class="group" id="inviteGroup" style="display:none;">
<label>管理员邀请码</label>
<div class="input-box">
<i class="fa fa-key"></i>
<input type="password" name="invite_code">
</div>
</div>

<div class="group">
<label>密码</label>
<div class="input-box">
<i class="fa fa-lock"></i>
<input type="password" id="password" name="password" required>
</div>

<div class="strength">
<div class="bar" id="bar"></div>
</div>

</div>

<div class="group">
<label>确认密码</label>
<div class="input-box">
<i class="fa fa-lock"></i>
<input type="password" id="confirm_password" name="confirm_password" required>
</div>
</div>

<button id="registerBtn">注册</button>

</form>

<div class="link">
已有账号？<a href="{{ url_for('auth.login') }}">返回登录</a>
</div>

</div>

<script>

/* 管理员邀请码 */

const role=document.getElementById("roleSelect")
const invite=document.getElementById("inviteGroup")

role.onchange=function(){
invite.style.display=this.value==="admin"?"block":"none"
document.getElementById("username").placeholder = this.value==="admin" ? "admin+数字" : "纯数字"
}

/* 密码强度 */

const pwd=document.getElementById("password")
const bar=document.getElementById("bar")

pwd.oninput=function(){

let v=this.value
let s=0

if(v.length>=6)s++
if(/[0-9]/.test(v))s++
if(/[a-zA-Z]/.test(v))s++
if(/[^0-9a-zA-Z]/.test(v))s++

let w=s*25

bar.style.width=w+"%"

if(s<=1)bar.style.background="red"
else if(s<=2)bar.style.background="orange"
else bar.style.background="green"

}

/* 提交检查 */

document.getElementById("registerForm").addEventListener("submit",function(e){

const p=pwd.value
const c=document.getElementById("confirm_password").value

if(p!==c){
alert("两次密码不一致")
e.preventDefault()
}

if(p.length<6){
alert("密码不能少于6位")
e.preventDefault()
}

})

</script>

</body>
</html>
